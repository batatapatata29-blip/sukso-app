<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>숙소 관리 수첩</title>
<style>
  :root{
    --paper: #EEF0EA;
    --paper-line: #D9DCCF;
    --surface: #FFFFFF;
    --ink: #1F2A22;
    --ink-soft: #57604F;
    --teal: #2B6E63;
    --teal-soft: #E1EEEB;
    --mustard: #B4842A;
    --mustard-soft: #F5EAD3;
    --clay: #A6432A;
    --clay-soft: #F5E2DB;
    --radius: 10px;
    --serif: "Roboto Slab","Noto Serif KR",serif;
    --sans: -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
    --mono: "IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{padding-bottom:90px;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--paper-line);
    padding:14px 16px 0 16px;
  }
  .topbar h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:20px;
    margin:2px 0 12px 0;
    letter-spacing:-0.2px;
  }
  .tabs{display:flex;gap:0;margin:0;}
  .tab{
    flex:1;text-align:center;padding:10px 0 12px 0;
    font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;cursor:pointer;
    background:none;border-top:none;border-left:none;border-right:none;
    font-family:var(--sans);
  }
  .tab.active{color:var(--ink);border-bottom:2px solid var(--teal);}
  main{padding:14px 14px 0 14px;max-width:520px;margin:0 auto;}

  /* summary bar */
  .summary{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;
  }
  .summary .date{font-size:12px;color:var(--ink-soft);}
  .summary .count{font-family:var(--serif);font-size:20px;font-weight:700;}
  .summary .count span{color:var(--teal);}
  .relist-btn{
    font-size:12px;color:var(--ink-soft);background:none;border:1px solid var(--paper-line);
    border-radius:20px;padding:6px 12px;cursor:pointer;font-family:var(--sans);
  }

  /* picker */
  .picker-intro{font-size:13px;color:var(--ink-soft);margin:4px 0 12px 0;line-height:1.5;}
  .picker-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .picker-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:8px;padding:10px 12px;cursor:pointer;
  }
  .picker-row.checked{border-color:var(--teal);background:var(--teal-soft);}
  .picker-row input{width:18px;height:18px;accent-color:var(--teal);flex-shrink:0;}
  .picker-row .pname{font-size:14px;font-weight:600;}
  .picker-row .paddr{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .confirm-btn{
    position:sticky;bottom:14px;width:100%;
    background:var(--ink);color:#fff;border:none;border-radius:var(--radius);
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);
  }
  .confirm-btn:disabled{background:#B9BEB2;}

  /* today card */
  .job-card{
    background:var(--surface);border:1px solid var(--paper-line);
    border-left:4px solid var(--mustard);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;
  }
  .job-card.done{border-left-color:var(--teal);opacity:0.72;}
  .job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .job-name{font-family:var(--serif);font-size:16px;font-weight:700;}
  .job-owner{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .badge-row{display:flex;gap:6px;flex-shrink:0;}
  .badge{font-size:11px;font-family:var(--mono);padding:3px 6px;border-radius:5px;background:var(--mustard-soft);color:var(--mustard);white-space:nowrap;}
  .job-addr{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.4;}
  .job-addr a{color:var(--teal);text-decoration:none;}
  .job-addr a:active{opacity:0.7;}
  .job-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .pill-btn{
    font-size:12px;border:1px solid var(--paper-line);background:var(--paper);
    border-radius:20px;padding:6px 11px;cursor:pointer;color:var(--ink);text-decoration:none;
    font-family:var(--sans);display:inline-flex;align-items:center;gap:4px;
  }
  .pw-value{font-family:var(--mono);font-size:13px;background:var(--clay-soft);color:var(--clay);padding:6px 10px;border-radius:6px;letter-spacing:0.3px;}
  .task-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .task-item{
    display:flex;align-items:flex-start;gap:9px;cursor:pointer;
    border:1px solid var(--paper-line);border-radius:8px;padding:9px 10px;
    background:var(--surface);
  }
  .task-item .box{
    width:18px;height:18px;border-radius:5px;border:1.5px solid var(--mustard);
    flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;
  }
  .task-item.done{background:var(--teal-soft);border-color:var(--teal);}
  .task-item.done .box{background:var(--teal);border-color:var(--teal);}
  .task-item .ttext{font-size:13px;line-height:1.45;color:var(--ink);}
  .task-item.done .ttext{color:var(--ink-soft);text-decoration:line-through;}
  .task-meta{font-size:11px;color:var(--ink-soft);margin-top:8px;}

  /* all list */
  .search-box{
    width:100%;padding:11px 14px;border:1px solid var(--paper-line);border-radius:var(--radius);
    font-size:14px;margin-bottom:12px;background:var(--surface);color:var(--ink);font-family:var(--sans);
  }
  .prop-card{
    background:var(--surface);border:1px solid var(--paper-line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
  }
  .prop-top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px;}
  .prop-name{font-family:var(--serif);font-size:15px;font-weight:700;}
  .prop-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .chevron{font-size:12px;color:var(--ink-soft);flex-shrink:0;transition:transform .15s;}
  .prop-card.open .chevron{transform:rotate(90deg);}
  .prop-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--paper-line);}
  .prop-card.open .prop-detail{display:block;}
  .detail-row{font-size:13px;margin-bottom:6px;color:var(--ink);}
  .detail-row b{color:var(--ink-soft);font-weight:600;margin-right:4px;}
  .detail-actions{display:flex;gap:8px;margin-top:10px;}
  .detail-actions button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--sans);border:1px solid var(--paper-line);background:var(--paper);}
  .detail-actions .del{color:var(--clay);}

  .fab{
    position:fixed;right:18px;bottom:18px;
    width:52px;height:52px;border-radius:50%;
    background:var(--ink);color:#fff;border:none;font-size:26px;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);cursor:pointer;z-index:30;
  }

  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13px;line-height:1.6;}

  /* map tab */
  .map-scope{display:flex;gap:8px;margin-bottom:12px;}
  .scope-btn{
    flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--paper-line);background:var(--surface);color:var(--ink-soft);font-family:var(--sans);
  }
  .scope-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  #kakaoMapDiv{
    width:100%;height:62vh;border-radius:var(--radius);border:1px solid var(--paper-line);
    background:var(--surface);
  }
  .map-hint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.5;}
  .setup-card{background:var(--surface);border:1px solid var(--paper-line);border-radius:var(--radius);padding:16px;}
  .setup-card h3{font-family:var(--serif);font-size:16px;margin:0 0 8px 0;}
  .setup-card p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0 0 12px 0;}
  .setup-card input{width:100%;padding:10px 11px;border:1px solid var(--paper-line);border-radius:8px;font-size:13px;font-family:var(--mono);background:var(--paper);color:var(--ink);margin-bottom:10px;}
  .link-row{margin-top:6px;}
  .link-row button{font-size:11px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;font-family:var(--sans);}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,24,18,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
  }
  .sheet{
    background:var(--surface);width:100%;max-width:520px;
    border-radius:16px 16px 0 0;padding:18px 16px 22px 16px;
    max-height:86vh;overflow-y:auto;
  }
  .sheet h2{font-family:var(--serif);font-size:17px;margin:0 0 14px 0;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
  .field input,.field textarea{
    width:100%;padding:10px 11px;border:1px solid var(--paper-line);border-radius:8px;
    font-size:14px;font-family:var(--sans);background:var(--paper);color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sheet-actions{display:flex;gap:8px;margin-top:14px;}
  .sheet-actions button{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:var(--sans);}
  .save-btn{background:var(--ink);color:#fff;}
  .cancel-btn{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line) !important;}
</style>
</head>

// window.storage가 없으므로 브라우저 localStorage로 대신 동작하게 함
if(!window.storage){
  window.storage = {
    async get(key, shared){
      const raw = localStorage.getItem(key);
      if(raw === null || raw === undefined) return null;
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    }
  };
}

async function loadProperties(){
  try{
    const res = await window.storage.get(KEY_PROPS, false);
    if(res && res.value){ state.properties = JSON.parse(res.value); return; }
  }catch(e){}
  state.properties = DEFAULT_PROPERTIES;
  await saveProperties();
}
async function saveProperties(){
  try{ await window.storage.set(KEY_PROPS, JSON.stringify(state.properties), false); }catch(e){}
}
async function loadTodayRecord(){
  try{
    const res = await window.storage.get(todayKey(), false);
    if(res && res.value){
      const rec = JSON.parse(res.value);
      if(rec && rec.tasks){ state.todayRecord = rec; return; } // 예전 형식이면 새로 만들게 함
    }
  }catch(e){}
  state.todayRecord = null;
}

async function loadKakaoKey(){
  try{
    const res = await window.storage.get('settings:kakaoKey', false);
    if(res && res.value){ state.kakaoKey = res.value; }
  }catch(e){}
}
async function saveKakaoKey(key){
  state.kakaoKey = key;
  try{ await window.storage.set('settings:kakaoKey', key, false); }catch(e){}
}
async function clearKakaoKey(){
  state.kakaoKey = null;
  state.mapReady = false;
  try{ await window.storage.delete('settings:kakaoKey', false); }catch(e){}
}
async function loadGeocodeCache(){
  try{
    const res = await window.storage.get('geocode:cache', false);
    if(res && res.value){ state.geocodeCache = JSON.parse(res.value); return; }
  }catch(e){}
  state.geocodeCache = {};
}
async function saveGeocodeCache(){
  try{ await window.storage.set('geocode:cache', JSON.stringify(state.geocodeCache), false); }catch(e){}
}
async function saveTodayRecord(){
  try{ await window.storage.set(todayKey(), JSON.stringify(state.todayRecord), false); }catch(e){}
}

function propById(id){ return state.properties.find(p=>p.id===id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 참고사항 텍스트를 개별 체크 항목으로 쪼갬
function splitNotes(notes){
  if(!notes || !notes.trim()) return [];
  return notes
    .split(/[,，、.\n;]+/)
    .map(s=>s.trim())
    .filter(s=>s.length>0);
}
function kakaoMapUrl(address){
  return 'https://map.kakao.com/link/search/' + encodeURIComponent(address);
}
function tasksForProperty(p){
  const items = splitNotes(p.notes);
  if(items.length===0) return ['청소상태 확인','세탁물 반납'];
  return items;
}

function renderDateLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function render(){
  const view = document.getElementById('view');
  const fab = document.getElementById('fab');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===state.tab));

  if(state.tab === 'today'){
    fab.style.display='none';
    view.innerHTML = renderToday();
    attachHandlers();
  } else if(state.tab === 'all'){
    fab.style.display='flex';
    fab.style.alignItems='center';
    fab.style.justifyContent='center';
    view.innerHTML = renderAll();
    attachHandlers();
  } else if(state.tab === 'map'){
    fab.style.display='none';
    view.innerHTML = renderMapTab();
    attachHandlers();
    setupMapIfNeeded();
  }
}

function renderToday(){
  if(!state.todayRecord){
    const rows = state.properties.map(p=>`
      <label class="picker-row ${state.pickerSelection.has(p.id)?'checked':''}" data-pick="${p.id}">
        <input type="checkbox" ${state.pickerSelection.has(p.id)?'checked':''} data-pick-cb="${p.id}">
        <div>
          <div class="pname">${esc(p.name)}</div>
          <div class="paddr">${esc(p.address)}</div>
        </div>
      </label>
    `).join('');
    return `
      <div class="picker-intro">오늘(${renderDateLabel()}) 방문할 업체를 골라줘. 업체별 참고사항이 자동으로 체크리스트가 돼.</div>
      <div class="picker-list">${rows}</div>
      <button class="confirm-btn" id="confirmPick" ${state.pickerSelection.size===0?'disabled':''}>오늘의 리스트 만들기 (${state.pickerSelection.size})</button>
    `;
  }

  const ids = state.todayRecord.propertyIds;
  const taskMap = state.todayRecord.tasks;
  const doneCount = ids.filter(id => taskMap[id].every(t=>t.done)).length;

  const cards = ids.map(id=>{
    const p = propById(id);
    if(!p) return '';
    const tasks = taskMap[id];
    const isDone = tasks.every(t=>t.done);
    const taskRows = tasks.map((t,idx)=>`
      <div class="task-item ${t.done?'done':''}" data-task="${id}:${idx}">
        <div class="box">${t.done?'✓':''}</div>
        <div class="ttext">${esc(t.text)}</div>
      </div>
    `).join('');
    return `
      <div class="job-card ${isDone?'done':''}">
        <div class="job-head">
          <div>
            <div class="job-name">${esc(p.name)}</div>
            <div class="job-owner">${esc(p.owner||'담당자 미기재')}</div>
          </div>
          <div class="badge-row">
            <span class="badge">OUT ${esc(p.out)}</span>
            <span class="badge">IN ${esc(p.in)}</span>
          </div>
        </div>
        <div class="job-addr"><a href="${kakaoMapUrl(p.address)}" target="_blank" rel="noopener">🧭 ${esc(p.address)}</a></div>
        <div class="job-row">
          ${p.phone ? `<a class="pill-btn" href="tel:${esc(p.phone)}">📞 ${esc(p.phone)}</a>` : ''}
          <button class="pill-btn" data-reveal="${id}">🔑 비밀번호 보기</button>
        </div>
        <div class="job-row" data-pw-slot="${id}"></div>
        <div class="task-list">${taskRows}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="summary">
      <div>
        <div class="date">${renderDateLabel()}</div>
        <div class="count"><span>${doneCount}</span> / ${ids.length} 완료</div>
      </div>
      <button class="relist-btn" id="relist">오늘 리스트 다시 선택</button>
    </div>
    ${cards}
  `;
}

function renderAll(){
  const q = state.search.trim().toLowerCase();
  const list = state.properties.filter(p =>
    !q || p.name.toLowerCase().includes(q) || (p.owner||'').toLowerCase().includes(q) || (p.address||'').toLowerCase().includes(q)
  );
  const cards = list.map(p=>{
    const open = state.openIds.has(p.id);
    return `
    <div class="prop-card ${open?'open':''}">
      <div class="prop-top" data-toggle="${p.id}">
        <div>
          <div class="prop-name">${esc(p.name)}</div>
          <div class="prop-sub">${esc(p.owner||'담당자 미기재')} · ${esc(p.address)}</div>
        </div>
        <div class="chevron">▶</div>
      </div>
      <div class="prop-detail">
        <div class="detail-row"><b>주소</b><a href="${kakaoMapUrl(p.address)}" target="_blank" rel="noopener" style="color:var(--teal);">🧭 ${esc(p.address)}</a></div>
        <div class="detail-row"><b>연락처</b>${p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:'-'}</div>
        <div class="detail-row"><b>체크인·아웃</b>OUT ${esc(p.out)||'-'} / IN ${esc(p.in)||'-'}</div>
        <div class="detail-row"><b>룸/화장실</b>${esc(p.rooms)||'-'}</div>
        <div class="detail-row"><b>침대</b>${esc(p.beds)||'-'}</div>
        <div class="detail-row"><b>비밀번호</b><span class="pw-value">${esc(p.password)||'-'}</span></div>
        <div class="detail-row"><b>참고사항</b>${esc(p.notes)||'-'}</div>
        <div class="detail-actions">
          <button data-edit="${p.id}">수정</button>
          <button class="del" data-del="${p.id}">삭제</button>
        </div>
      </div>
    </div>
    `;
  }).join('');

  return `
    <input class="search-box" id="searchBox" placeholder="상호명·담당자·주소로 검색" value="${esc(state.search)}">
    ${list.length ? cards : `<div class="empty">검색 결과가 없어.<br>다른 검색어로 찾아봐.</div>`}
  `;
}

        <p>카카오 개발자센터(developers.kakao.com)에서 발급받은 <b>JavaScript 키</b>를 붙여넣어줘. 무료이고, 한 번만 입력하면 계속 저장돼.</p>

function openEditSheet(prop){
  state.editing = prop ? {...prop} : {id:null,name:'',owner:'',phone:'',address:'',password:'',out:'',in:'',rooms:'',beds:'',notes:''};
  const e = state.editing;
  const root = document.createElement('div');
  root.className = 'overlay';
  root.id = 'overlay';
  root.innerHTML = `
    <div class="sheet">
      <h2>${e.id ? '업체 정보 수정' : '새 업체 추가'}</h2>
      <div class="field"><label>상호명</label><input id="f_name" value="${esc(e.name)}"></div>
      <div class="field"><label>담당자</label><input id="f_owner" value="${esc(e.owner)}"></div>
      <div class="field"><label>연락처</label><input id="f_phone" value="${esc(e.phone)}"></div>
      <div class="field"><label>주소</label><input id="f_address" value="${esc(e.address)}"></div>
      <div class="field"><label>비밀번호</label><input id="f_password" value="${esc(e.password)}"></div>
      <div class="field-grid">
        <div class="field"><label>체크아웃(OUT)</label><input id="f_out" value="${esc(e.out)}"></div>
        <div class="field"><label>체크인(IN)</label><input id="f_in" value="${esc(e.in)}"></div>
      </div>
      <div class="field-grid">
        <div class="field"><label>룸/화장실</label><input id="f_rooms" value="${esc(e.rooms)}"></div>
        <div class="field"><label>침대구성</label><input id="f_beds" value="${esc(e.beds)}"></div>
      </div>
      <div class="field"><label>참고사항</label><textarea id="f_notes">${esc(e.notes)}</textarea></div>
      <div class="sheet-actions">
        <button class="cancel-btn" id="cancelEdit">취소</button>
        <button class="save-btn" id="saveEdit">저장</button>
      </div>
    </div>
  `;
  document.body.appendChild(root);
  document.getElementById('cancelEdit').onclick = ()=> root.remove();
  document.getElementById('saveEdit').onclick = async ()=>{
    const vals = {
      name: document.getElementById('f_name').value.trim(),
      owner: document.getElementById('f_owner').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      password: document.getElementById('f_password').value.trim(),
      out: document.getElementById('f_out').value.trim(),
      in: document.getElementById('f_in').value.trim(),
      rooms: document.getElementById('f_rooms').value.trim(),
      beds: document.getElementById('f_beds').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
    };
    if(!vals.name){ alert('상호명은 필수야.'); return; }
    if(e.id){
      const idx = state.properties.findIndex(p=>p.id===e.id);
      state.properties[idx] = {...state.properties[idx], ...vals};
    } else {
      const newId = 'p' + (Date.now());
      state.properties.push({id:newId, ...vals});
    }
    await saveProperties();
    root.remove();
    render();
  };
}

let kakaoSDKPromise = null;
function loadKakaoSDK(key){
  if(window.kakao && window.kakao.maps && window.kakao.maps.services){
    return Promise.resolve();
  }
  if(kakaoSDKPromise) return kakaoSDKPromise;
  kakaoSDKPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false&libraries=services`;
    script.onload = ()=>{
      window.kakao.maps.load(()=> resolve());
    };
    script.onerror = ()=>{ kakaoSDKPromise = null; reject(new Error('sdk load failed')); };
    document.head.appendChild(script);
  });
  return kakaoSDKPromise;
}

function geocodeAddress(address){
  if(state.geocodeCache[address]) return Promise.resolve(state.geocodeCache[address]);
  return new Promise((resolve)=>{
    const geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(address, (result, status)=>{
      if(status === kakao.maps.services.Status.OK && result[0]){
        const coord = { lat: Number(result[0].y), lng: Number(result[0].x) };
        state.geocodeCache[address] = coord;
        resolve(coord);
      } else {
        resolve(null);
      }
    });
  });
}

let kakaoMapInstance = null;
async function setupMapIfNeeded(){
  if(!state.kakaoKey) return;
  const container = document.getElementById('kakaoMapDiv');
  if(!container) return;

  container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--ink-soft);">지도를 불러오는 중...</div>';
  try{
    await loadKakaoSDK(state.kakaoKey);
  }catch(e){
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--clay);">지도를 불러오지 못했어. 키가 맞는지, 이 주소가 카카오 개발자센터의 Web 플랫폼에 등록돼 있는지 확인해줘.</div>';
    return;
  }
  container.innerHTML = '';

  const targetIds = state.mapScope === 'today'
    ? (state.todayRecord ? state.todayRecord.propertyIds : [])
    : state.properties.map(p=>p.id);
  const targets = targetIds.map(id=>propById(id)).filter(p=>p && p.address);

  if(targets.length === 0){
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--ink-soft);">표시할 업체가 없어. ' + (state.mapScope==='today' ? '먼저 "오늘" 탭에서 오늘의 리스트를 만들어줘.' : '') + '</div>';
    return;
  }

  const map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.5563, 126.9236), // 마포구 기준
    level: 7
  });
  kakaoMapInstance = map;

  const bounds = new kakao.maps.LatLngBounds();
  const infowindow = new kakao.maps.InfoWindow({ removable: true });
  let placed = 0;

  for(const p of targets){
    const coord = await geocodeAddress(p.address);
    if(!coord) continue;
    const pos = new kakao.maps.LatLng(coord.lat, coord.lng);
    const marker = new kakao.maps.Marker({ position: pos, map });
    kakao.maps.event.addListener(marker, 'click', ()=>{
      infowindow.setContent(`<div style="padding:6px 10px;font-size:12.5px;">${esc(p.name)}</div>`);
      infowindow.open(map, marker);
    });
    bounds.extend(pos);
    placed++;
  }
  await saveGeocodeCache();

  if(placed > 0){
    map.setBounds(bounds);
  } else {
    container.innerHTML = '<div style="padding:16px;font-size:13px;color:var(--clay);">주소로 좌표를 찾지 못했어. 주소 표기를 다시 확인해줘.</div>';
  }
}

function attachHandlers(){
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = (ev)=>{
      if(ev.target.tagName === 'INPUT') return;
      togglePick(el.dataset.pick);
    };
  });
  document.querySelectorAll('[data-pick-cb]').forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation(); togglePick(el.dataset.pickCb); };
  });
  const confirmBtn = document.getElementById('confirmPick');
  if(confirmBtn) confirmBtn.onclick = createTodayList;

  const relist = document.getElementById('relist');
  if(relist) relist.onclick = ()=>{
    state.pickerSelection = new Set(state.todayRecord.propertyIds);
    state.todayRecord = null;
    render();
  };

  document.querySelectorAll('[data-task]').forEach(el=>{
    el.onclick = async ()=>{
      const [id, idx] = el.dataset.task.split(':');
      const t = state.todayRecord.tasks[id][Number(idx)];
      t.done = !t.done;
      await saveTodayRecord();
      render();
    };
  });

  document.querySelectorAll('[data-reveal]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.reveal;
      const p = propById(id);
      const slot = document.querySelector(`[data-pw-slot="${id}"]`);
      slot.innerHTML = `<span class="pw-value">🔑 ${esc(p.password)||'등록된 비밀번호 없음'}</span>`;
    };
  });

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.toggle;
      if(state.openIds.has(id)) state.openIds.delete(id); else state.openIds.add(id);
      render();
    };
  });

  const searchBox = document.getElementById('searchBox');
  if(searchBox){
    searchBox.oninput = (e)=>{ state.search = e.target.value; render(); setTimeout(()=>{
      const sb=document.getElementById('searchBox'); if(sb){sb.focus(); sb.setSelectionRange(sb.value.length,sb.value.length);}
    },0); };
  }

  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation(); openEditSheet(propById(el.dataset.edit)); };
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = async (ev)=>{
      ev.stopPropagation();
      const p = propById(el.dataset.del);
      if(confirm(`"${p.name}"을(를) 목록에서 삭제할까?`)){
        state.properties = state.properties.filter(x=>x.id!==p.id);
        await saveProperties();
        render();
      }
    };
  });

  const saveKakaoKeyBtn = document.getElementById('saveKakaoKeyBtn');
  if(saveKakaoKeyBtn){
    saveKakaoKeyBtn.onclick = async ()=>{
      const val = document.getElementById('kakaoKeyInput').value.trim();
      if(!val){ alert('JavaScript 키를 입력해줘.'); return; }
      await saveKakaoKey(val);
      render();
    };
  }
  const changeKakaoKey = document.getElementById('changeKakaoKey');
  if(changeKakaoKey){
    changeKakaoKey.onclick = async ()=>{
      if(confirm('저장된 카카오 키를 지울까? 다시 넣기 전까지 지도를 못 봐.')){
        await clearKakaoKey();
        render();
      }
    };
  }
  document.querySelectorAll('[data-scope]').forEach(el=>{
    el.onclick = ()=>{
      state.mapScope = el.dataset.scope;
      render();
    };
  });
}

function togglePick(id){
  if(state.pickerSelection.has(id)) state.pickerSelection.delete(id);
  else state.pickerSelection.add(id);
  render();
}

async function createTodayList(){
  const tasks = {};
  state.pickerSelection.forEach(id=>{
    const p = propById(id);
    tasks[id] = tasksForProperty(p).map(text=>({text, done:false}));
  });
  state.todayRecord = { propertyIds: Array.from(state.pickerSelection), tasks };
  await saveTodayRecord();
  render();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{ state.tab = t.dataset.tab; render(); };
});
document.getElementById('fab').onclick = ()=> openEditSheet(null);

(async function init(){
  await loadProperties();
  await loadTodayRecord();
  await loadKakaoKey();
  await loadGeocodeCache();
  render();
})();
</script>
